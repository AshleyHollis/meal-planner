# =============================================================================
# Argo CD Repository Secret
# =============================================================================
# Registers the meal-planner repo with Argo CD (public repo - no credentials)
apiVersion: v1
kind: Secret
metadata:
  name: meal-planner-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/AshleyHollis/meal-planner.git
