# =============================================================================
# Argo CD Application - Production
# =============================================================================
# Single production application - auto-syncs on merge to master
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meal-planner-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: meal-planner
    app.kubernetes.io/instance: prod
    app.kubernetes.io/part-of: meal-planner
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/AshleyHollis/meal-planner.git
    targetRevision: master
    path: k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: meal-planner

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: batch
      kind: Job
      jqPathExpressions:
        - .status.completionTime
        - .status.conditions
        - .status.startTime
        - .status.succeeded
        - .status.active
        - .status.failed
