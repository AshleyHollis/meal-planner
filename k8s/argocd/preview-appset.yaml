# =============================================================================
# Argo CD ApplicationSet - Preview Environments
# =============================================================================
# Uses Git Files Generator to discover preview overlays on the preview-overlays
# branch. Each PR gets a directory: k8s/overlays/preview-pr-{number}/
#
# FLOW:
#   1. CI builds image -> preview.yml updates overlay -> commits to preview-overlays
#   2. ArgoCD discovers the new directory via Git Generator
#   3. ArgoCD syncs from preview-overlays branch using PR-specific path
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: meal-planner-previews
  namespace: argocd
  labels:
    app.kubernetes.io/name: meal-planner
    app.kubernetes.io/component: preview
    app.kubernetes.io/part-of: meal-planner
spec:
  generators:
    - git:
        repoURL: https://github.com/AshleyHollis/meal-planner.git
        revision: preview-overlays

        # Discover preview overlays by directory pattern
        directories:
          - path: k8s/overlays/preview-pr-*
            exclude: false

        # Poll every 15s to quickly detect overlay commits
        requeueAfterSeconds: 15

  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
      labels:
        app.kubernetes.io/name: meal-planner
        app.kubernetes.io/instance: '{{path.basename}}'
        app.kubernetes.io/component: preview
        app.kubernetes.io/part-of: meal-planner
      annotations:
        preview.meal-planner/overlay-path: '{{path}}'
        preview.meal-planner/overlay-revision: '{{revision}}'
        argocd.argoproj.io/refresh: hard
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default

      source:
        repoURL: https://github.com/AshleyHollis/meal-planner.git
        targetRevision: preview-overlays
        path: '{{path}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      revisionHistoryLimit: 3

      ignoreDifferences:
        - group: batch
          kind: Job
          jqPathExpressions:
            - .status.completionTime
            - .status.conditions
            - .status.startTime
            - .status.succeeded
            - .status.active
            - .status.failed

  syncPolicy:
    preserveResourcesOnDeletion: false
