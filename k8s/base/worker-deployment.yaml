# =============================================================================
# Meal Plan Worker Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meal-plan-worker
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: meal-plan-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: meal-planner
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meal-plan-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meal-plan-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: meal-planner
    spec:
      serviceAccountName: meal-planner-sa
      containers:
        - name: worker
          image: meal-planner-worker
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8091
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: connection-string
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: storage-credentials
                  key: connection-string
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: api-key
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: azure-api-key
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: azure-endpoint
            - name: AZURE_OPENAI_DEPLOYMENT
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: azure-deployment
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: meal-planner-config
                  key: ENVIRONMENT
            - name: QUEUE_POLL_INTERVAL
              value: "10.0"
            - name: HEALTH_PORT
              value: "8091"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
      restartPolicy: Always
