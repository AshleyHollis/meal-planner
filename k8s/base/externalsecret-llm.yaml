# =============================================================================
# ExternalSecret for LLM API Key
# =============================================================================
# Syncs LLM API key from Azure Key Vault to K8s Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-credentials
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: meal-planner
    app.kubernetes.io/part-of: meal-planner
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: azure-keyvault
  target:
    name: llm-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: meal-planner-llm-api-key
