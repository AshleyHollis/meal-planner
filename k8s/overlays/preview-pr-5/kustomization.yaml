apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  annotations:
    config.kubernetes.io/local-config: "true"

namespace: preview-pr-5

resources:
  - ../../base-preview

images:
  - name: meal-planner-api
    newName: acrytsummprd.azurecr.io/meal-planner-api
    newTag: pr-5-b2f0bf3
  - name: meal-planner-worker
    newName: acrytsummprd.azurecr.io/meal-planner-worker
    newTag: pr-5-b2f0bf3

patches:
  # ExternalSecret patches - reference ClusterSecretStore for preview namespaces
  - patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: db-credentials
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: azure-keyvault-cluster
    target:
      kind: ExternalSecret
      name: db-credentials

  - patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: storage-credentials
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: azure-keyvault-cluster
    target:
      kind: ExternalSecret
      name: storage-credentials

  - patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: llm-credentials
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: azure-keyvault-cluster
    target:
      kind: ExternalSecret
      name: llm-credentials

  - patch: |-
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: auth0-credentials
      spec:
        secretStoreRef:
          kind: ClusterSecretStore
          name: azure-keyvault-cluster
    target:
      kind: ExternalSecret
      name: auth0-credentials

  # ConfigMap patch - CORS origins with SWA URL
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: meal-planner-config
      data:
        ENVIRONMENT: "preview"
        LOG_LEVEL: "DEBUG"
    target:
      kind: ConfigMap
      name: meal-planner-config

  # API Deployment patch - CORS origins env var
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
            - name: api
              env:
              - name: API__CORS_ORIGINS
                # JSON array string - keep no spaces after commas
                value: '["https://red-grass-06d413100-5.eastasia.6.azurestaticapps.net","http://localhost:3000"]'
    target:
      kind: Deployment
      name: api

  # HTTPRoute patch - preview hostname
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: api-httproute
        annotations:
          external-dns.alpha.kubernetes.io/hostname: api-pr-5.meal-planner.apps.ashleyhollis.com
      spec:
        hostnames:
        - "api-pr-5.meal-planner.apps.ashleyhollis.com"
    target:
      kind: HTTPRoute
      name: api-httproute

  # Replicas patch - single replica for all deployments
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component

  # Resource limits patch - API deployment
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
    target:
      kind: Deployment
      name: api

  # Resource limits patch - Worker deployments
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 256Mi
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=worker

  # Migration job patch - resource limits
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 256Mi
    target:
      kind: Job
      name: db-migration

  # Per-PR database isolation: point ExternalSecret to PR-specific Key Vault secret
  - target:
      kind: ExternalSecret
      name: db-credentials
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: meal-planner-sql-connection-string-pr-5
