apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-httproute
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: meal-planner
    app.kubernetes.io/component: api
  annotations:
    # ExternalDNS watches this annotation to create DNS records
    external-dns.alpha.kubernetes.io/hostname: api.meal-planner.apps.ashleyhollis.com
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway-system
      sectionName: https-meal-planner
  hostnames:
    - "api.meal-planner.apps.ashleyhollis.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 80
          weight: 100
