# =============================================================================
# ExternalSecret for Azure Storage Connection
# =============================================================================
# Syncs Azure Storage connection string from Azure Key Vault to K8s Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: storage-credentials
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: meal-planner
    app.kubernetes.io/part-of: meal-planner
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: azure-keyvault
  target:
    name: storage-credentials
    creationPolicy: Owner
  data:
    - secretKey: connection-string
      remoteRef:
        key: meal-planner-storage-connection
