# =============================================================================
# ServiceAccount with Azure Workload Identity
# =============================================================================
# Used by all pods (API, worker, migration job) for Azure authentication.
# Extracted from secretstore.yaml for preview environments which use
# ClusterSecretStore instead of namespace-scoped SecretStore.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meal-planner-sa
  namespace: meal-planner
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    azure.workload.identity/client-id: "PLACEHOLDER"
    azure.workload.identity/tenant-id: "c2d723a2-474e-44d2-a37c-9b4e9cb823d4"
  labels:
    azure.workload.identity/use: "true"
