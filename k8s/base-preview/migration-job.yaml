# =============================================================================
# Database Migration Job
# =============================================================================
# Argo CD PreSync hook - runs before new deployments
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: meal-planner
  labels:
    app.kubernetes.io/name: db-migration
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: meal-planner
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migration
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: meal-planner
    spec:
      serviceAccountName: meal-planner-sa
      restartPolicy: Never
      containers:
        - name: migration
          image: meal-planner-api
          command:
            - /bin/sh
            - -c
            - |
              echo "=== Database Migration ==="
              echo "PYTHONPATH=$PYTHONPATH"
              echo "DATABASE_URL is set: $([ -n "$DATABASE_URL" ] && echo yes || echo NO)"

              cd /app/shared || { echo "FATAL: /app/shared does not exist"; exit 1; }
              echo "Working directory: $(pwd)"

              if [ ! -f alembic.ini ]; then
                echo "FATAL: alembic.ini not found in $(pwd)"
                ls -la
                exit 1
              fi
              echo "alembic.ini found"

              echo "Alembic version: $(python -m alembic --version 2>&1 || echo 'NOT INSTALLED')"
              echo "Files in alembic/versions/:"
              ls -la alembic/versions/ 2>/dev/null || echo "  (directory not found)"

              echo "Running: alembic upgrade head"
              if python -m alembic upgrade head 2>&1; then
                echo "=== Migrations completed successfully ==="
              else
                EXIT_CODE=$?
                echo "=== Migration FAILED (exit code: $EXIT_CODE) ==="
                echo "Attempting alembic current to check state:"
                python -m alembic current 2>&1 || true
                echo "Python version: $(python --version)"
                echo "Installed packages:"
                pip list 2>/dev/null | grep -iE "alembic|sqlalchemy|pyodbc|aioodbc" || true
                # Exit 0 to not block ArgoCD sync — migration failure is logged above
                echo "WARNING: Continuing despite migration failure"
              fi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
