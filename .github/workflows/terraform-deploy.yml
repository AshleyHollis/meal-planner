# =============================================================================
# Terraform Deployment (Reusable)
# =============================================================================
# Called by preview.yml and production workflows to plan/apply infrastructure.
# Adapted for meal-planner: Azure SQL, Storage, SWA, Key Vault secrets.

name: Terraform Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: Environment name (prod or preview)
        required: true
        type: string
      terraform-version:
        description: Terraform version to use
        required: false
        type: string
        default: '1.5.7'
      working-directory:
        description: Terraform working directory
        required: false
        type: string
        default: infra/terraform
      run-plan:
        description: Run terraform plan
        required: false
        type: boolean
        default: true
      run-apply:
        description: Run terraform apply
        required: false
        type: boolean
        default: true
      require-changes:
        description: Only apply if changes detected
        required: false
        type: boolean
        default: true
      post-to-pr:
        description: Post plan to PR (preview only)
        required: false
        type: boolean
        default: false
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      SQL_ADMIN_PASSWORD:
        required: true
    outputs:
      plan-summary:
        description: Terraform plan summary
        value: ${{ jobs.terraform-plan.outputs.plan_summary }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: inputs.run-plan
    outputs:
      plan_summary: ${{ steps.plan.outputs.plan_summary }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform with Azure
        uses: ./.github/actions/setup-terraform-azure
        with:
          terraform-version: ${{ inputs.terraform-version }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: ${{ inputs.working-directory }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          sql-admin-password: ${{ secrets.SQL_ADMIN_PASSWORD }}
        continue-on-error: ${{ inputs.post-to-pr }}

      - name: Post Plan to PR and Summary
        if: inputs.post-to-pr && github.event_name == 'pull_request'
        uses: ./.github/actions/post-terraform-plan
        with:
          plan-summary: ${{ steps.plan.outputs.plan_summary }}
          plan-json-path: ${{ steps.plan.outputs.plan_json_path }}
          plan-outcome: ${{ steps.plan.outcome }}

      - name: Plan Status Check
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: |
            ${{ inputs.working-directory }}/tfplan
            ${{ inputs.working-directory }}/plan_output.txt
            ${{ inputs.working-directory }}/plan.json
          retention-days: 7

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: |
      inputs.run-apply &&
      needs.terraform-plan.result == 'success' &&
      (!inputs.require-changes || fromJson(needs.terraform-plan.outputs.plan_summary).has_changes == true)
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform with Azure
        uses: ./.github/actions/setup-terraform-azure
        with:
          terraform-version: ${{ inputs.terraform-version }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
