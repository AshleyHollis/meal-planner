# =============================================================================
# CI Workflow - Automated Testing, Validation, and Image Building
# =============================================================================
# TRIGGERS: PR opened/updated against master, push to master, manual dispatch
# PHASES: lint -> security -> tests -> k8s-validate -> docker-build -> swa-deploy -> status
# =============================================================================

name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "specs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  ACR_NAME: ${{ vars.ACR_NAME || 'acrytsummprd' }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'acrytsummprd.azurecr.io' }}

defaults:
  run:
    shell: bash -e {0}

jobs:
  # ===========================================================================
  # PHASE 1: PYTHON LINTING
  # ===========================================================================
  python-lint:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install shared dependencies
        run: cd services/shared && uv sync --extra dev

      - name: Lint shared
        working-directory: services/shared
        run: uv run ruff check shared/

      - name: Format check shared
        working-directory: services/shared
        run: uv run ruff format --check shared/

      - name: Install API dependencies
        run: cd services/api && uv sync --extra dev

      - name: Lint API
        working-directory: services/api
        run: uv run ruff check src/

      - name: Format check API
        working-directory: services/api
        run: uv run ruff format --check src/

      - name: Install workers dependencies
        run: cd services/workers && uv sync --extra dev

      - name: Lint workers
        working-directory: services/workers
        run: uv run ruff check meal_plan_generator/

      - name: Format check workers
        working-directory: services/workers
        run: uv run ruff format --check meal_plan_generator/

  # ===========================================================================
  # PHASE 2: FRONTEND QUALITY
  # ===========================================================================
  frontend-quality:
    name: Frontend Quality (ESLint, tsc, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Run Vitest
        working-directory: apps/web
        run: npm test -- --run

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: >-
            ${{ runner.os }}-nextjs-
            ${{ hashFiles('apps/web/package-lock.json') }}-
            ${{ hashFiles('apps/web/next.config.*') }}-
            ${{ hashFiles('apps/web/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: TypeScript type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build Next.js application
        working-directory: apps/web
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          include-hidden-files: true
          path: |
            apps/web/.next
            apps/web/public
            apps/web/package.json
            apps/web/staticwebapp.config.json
            !apps/web/.next/cache

  # ===========================================================================
  # PHASE 3: SECURITY SCANNING
  # ===========================================================================
  security-scan:
    name: Security Scan (bandit, pip-audit)
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: uv tool install bandit

      - name: Scan shared with bandit
        run: bandit -r services/shared/shared/ -c pyproject.toml || bandit -r services/shared/shared/ -ll

      - name: Scan API with bandit
        run: bandit -r services/api/src/ -c pyproject.toml || bandit -r services/api/src/ -ll

      - name: Scan workers with bandit
        run: bandit -r services/workers/meal_plan_generator/ -c pyproject.toml || bandit -r services/workers/meal_plan_generator/ -ll

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Audit API dependencies
        working-directory: services/api
        run: uv export --no-hashes -o requirements.txt && pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-* || true

      - name: Audit workers dependencies
        working-directory: services/workers
        run: uv export --no-hashes -o requirements.txt && pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-* || true

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ===========================================================================
  # PHASE 4: PYTHON TESTS
  # ===========================================================================
  python-tests:
    name: Test ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [python-lint, security-scan]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: API
            package: services/api
            test-dir: tests/
          - name: Workers
            package: services/workers
            test-dir: tests/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: cd ${{ matrix.service.package }} && uv sync --extra dev

      - name: Run ${{ matrix.service.name }} tests
        working-directory: ${{ matrix.service.package }}
        run: uv run pytest ${{ matrix.service.test-dir }} -v --tb=short

  # ===========================================================================
  # PHASE 5: KUBERNETES VALIDATION
  # ===========================================================================
  k8s-validation:
    name: Kubernetes Validation (kustomize)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.6.0"

      - name: Validate base manifests
        run: kustomize build k8s/base/ > /dev/null

      - name: Validate prod overlay
        run: kustomize build k8s/overlays/prod/ > /dev/null

      - name: Validate preview overlay
        run: kustomize build k8s/overlays/preview/ > /dev/null

      - name: Install kubeval
        run: |
          curl -sL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz
          sudo mv kubeval /usr/local/bin/

      - name: Validate K8s schemas
        run: |
          kustomize build k8s/base/ | kubeval --strict --ignore-missing-schemas || true
          kustomize build k8s/overlays/prod/ | kubeval --strict --ignore-missing-schemas || true

  # ===========================================================================
  # PHASE 6: DOCKER BUILD (ACR push)
  # ===========================================================================
  docker-build-meta:
    name: Prepare Image Tag
    runs-on: ubuntu-latest
    if: |
      vars.ACR_NAME != '' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master')
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Generate image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image_tag=pr-${{ github.event.pull_request.number }}-$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    name: Build ${{ matrix.service }} Image
    runs-on: ubuntu-latest
    needs: [docker-build-meta, python-lint, security-scan]
    if: needs.docker-build-meta.result == 'success'
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: services/api/Dockerfile
            image: meal-planner-api
          - service: workers
            dockerfile: services/workers/Dockerfile
            image: meal-planner-workers
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: tags
        run: |
          TAGS="${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ needs.docker-build-meta.outputs.image_tag }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            TAGS="${TAGS}
          ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # PHASE 7: SWA DEPLOY
  # ===========================================================================
  swa-deploy:
    name: Deploy to Static Web Apps
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/web

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to SWA
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web
          output_location: .next
          skip_app_build: true
          config_file_location: apps/web

  # ===========================================================================
  # PHASE 8: TERRAFORM VALIDATION
  # ===========================================================================
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  # ===========================================================================
  # PHASE 9: CI STATUS GATE
  # ===========================================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - frontend-quality
      - security-scan
      - python-tests
      - k8s-validation
      - docker-build-meta
      - docker-build
      - swa-deploy
      - terraform-validate
    if: always()
    steps:
      - name: Evaluate results
        run: |
          echo "## CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python Lint | ${{ needs.python-lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend Quality | ${{ needs.frontend-quality.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python Tests | ${{ needs.python-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| K8s Validation | ${{ needs.k8s-validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SWA Deploy | ${{ needs.swa-deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Terraform Validate | ${{ needs.terraform-validate.result }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Check required jobs passed
        run: |
          # Required jobs must pass (skipped is OK for conditional jobs)
          REQUIRED_RESULTS=(
            "${{ needs.python-lint.result }}"
            "${{ needs.frontend-quality.result }}"
            "${{ needs.security-scan.result }}"
            "${{ needs.python-tests.result }}"
            "${{ needs.k8s-validation.result }}"
            "${{ needs.terraform-validate.result }}"
          )
          for result in "${REQUIRED_RESULTS[@]}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::Required CI job failed or was cancelled"
              exit 1
            fi
          done

          # Conditional jobs: only fail if they ran and failed (skipped is OK)
          CONDITIONAL_RESULTS=(
            "${{ needs.docker-build.result }}"
            "${{ needs.swa-deploy.result }}"
          )
          for result in "${CONDITIONAL_RESULTS[@]}"; do
            if [ "$result" = "failure" ]; then
              echo "::error::Conditional CI job failed"
              exit 1
            fi
          done

          echo "All CI checks passed!"
