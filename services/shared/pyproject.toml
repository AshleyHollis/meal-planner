[project]
name = "meal-planner-shared"
version = "0.1.0"
description = "Meal Planner Shared - Common code for API and workers"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",  # Required for SQLAlchemy asyncio support
    "azure-storage-queue>=12.12.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "alembic>=1.14.0",
    "pyodbc>=5.2.0",
    "aioodbc>=0.5.0",
    # OpenTelemetry for distributed tracing
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    # OpenTelemetry instrumentation packages
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",  # Database query traces
    "opentelemetry-instrumentation-logging>=0.50b0",  # Log-trace correlation
    "opentelemetry-instrumentation-system-metrics>=0.50b0",  # Process/system runtime metrics
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.hatch.build.targets.wheel.sources]
"" = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
