[project]
name = "meal-planner-workers"
version = "0.1.0"
description = "Meal Planner Workers - Background job processors"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.55.0",
    "meal-planner-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meal_plan_generator", "worker_utils"]

[tool.hatch.build.targets.wheel.sources]
"" = ""

[tool.uv.sources]
meal-planner-shared = { path = "../shared" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
