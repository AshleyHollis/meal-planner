# =============================================================================
# Production Overlay Kustomization Template
# =============================================================================
# This is a template for the production kustomization.yaml
# The script will load this and update image tags
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meal-planner

resources:
  - ../../base

# Image tags - updated by deploy-prod.yml workflow on merge
images:
  - name: meal-planner-api
    newName: acrytsummprdci.azurecr.io/meal-planner-api
    newTag: ${IMAGE_TAG}
  - name: meal-planner-worker
    newName: acrytsummprdci.azurecr.io/meal-planner-worker
    newTag: ${IMAGE_TAG}

# Production-specific patches (all inline for consistency)
patches:
  # ConfigMap patch - production environment variables
  - target:
      version: v1
      kind: ConfigMap
      name: meal-planner-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: meal-planner-config
        namespace: meal-planner
      data:
        ENVIRONMENT: "production"
        LOG_LEVEL: "INFO"
  # HTTPRoute patch - production hostname
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: api-httproute
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: api-httproute
        labels:
          app.kubernetes.io/environment: production
        annotations:
          external-dns.alpha.kubernetes.io/hostname: api.meal-planner.apps.ashleyhollis.com
      spec:
        hostnames:
        - "api.meal-planner.apps.ashleyhollis.com"
  # Production resource requests/limits - API
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: 25m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
  # Production resource requests/limits - Worker
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: meal-plan-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: meal-plan-worker
      spec:
        template:
          spec:
            containers:
              - name: worker
                resources:
                  requests:
                    cpu: 25m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi

labels:
  - pairs:
      environment: production
      app.kubernetes.io/part-of: meal-planner

commonAnnotations:
  deployment.kubernetes.io/environment: production
